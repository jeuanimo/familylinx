services:
  - type: web
    name: familylinx-web
    env: python
    plan: Standard
    region: oregon
    buildCommand: |
      pip install -r requirements.txt
    startCommand: |
      python manage.py migrate && python manage.py collectstatic --noinput && daphne -b 0.0.0.0 -p $PORT config.asgi:application
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_URL_PATH
        value: "admin/"
      - key: ADMIN_ALLOWED_IPS
        value: ""
      - key: INVITE_ONLY_SIGNUP
        value: "true"
      - key: PUBLIC_SIGNUP_ENABLED
        value: "false"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "fam-linx.org,www.fam-linx.org,familylinx-web.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://fam-linx.org,https://www.fam-linx.org,https://familylinx-web.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: familylinx-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: EMAIL_HOST
        value: "mail.privateemail.com"
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_HOST_USER
        value: "contact@fam-linx.org"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "contact@fam-linx.org"
      - key: INVITE_BCC_EMAIL
        value: "contact@fam-linx.org"
      - key: EMAIL_TIMEOUT
        value: "20"
      - key: CHAT_ENABLE_WEBSOCKETS
        value: "false"
      - key: SECURITY_BLOCKER_ENABLED
        value: "true"
      - key: SECURITY_BLOCKER_RATE_LIMIT_ENABLED
        value: "true"
      - key: SECURITY_BLOCKER_RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: SECURITY_BLOCKER_MAX_REQUESTS_PER_WINDOW
        value: "240"
      - key: SECURITY_BLOCKER_RATE_LIMIT_AUTHENTICATED
        value: "false"
      - key: SECURITY_BLOCKER_LOG_LEVEL
        value: "WARNING"
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      - key: CORS_ALLOW_CREDENTIALS
        value: "true"
    healthCheckPath: /

  - type: cron
    name: familylinx-keepalive
    env: python
    region: oregon
    schedule: "*/10 * * * *"
    buildCommand: echo "keepalive"
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://fam-linx.org/'); print('ping ok')"

databases:
  - name: familylinx-db
    plan: Standard
    region: oregon
