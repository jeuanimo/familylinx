name: Data guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No member data, databases or secrets in the repo
        run: python scripts/check_data_files.py
